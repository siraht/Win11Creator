name: Pre-Release WinUtil

permissions:
  contents: write
  actions: read
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      validation-depth:
        description: Lean DAW acceptance probe depth; StockControl always uses Quick
        required: true
        type: choice
        default: Release
        options:
          - Release
          - Quick

jobs:
  build-runspace:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    env:
      CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Generate Dev Docs and Update JSON Links
        shell: pwsh
        run: |
          Set-Location tools
          ./devdocs-generator.ps1

      - name: Compile project
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force; ./Compile.ps1
        continue-on-error: false # Directly fail the job on error, removing the need for a separate check

      - name: Create Pull Request for Updated Docs and JSON Links
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.AUTO_MERGE }}
          commit-message: 'chore: Update generated dev docs and JSON links'
          title: 'chore: Update generated dev docs and JSON links'
          body: 'Automated update of generated documentation and JSON config links from pre-release build'
          branch: docs-update
          delete-branch: true
          add-paths: |
            docs/src/content/docs/code-reference/
            config/tweaks.json
            config/feature.json
          labels: |
            automated
            documentation
            skip-changelog

      - name: Check outputs
        shell: bash
        run: |
          echo "Pull Request Number - ${{ steps.cpr.outputs.pull-request-number }}"
          echo "Pull Request URL - ${{ steps.cpr.outputs.pull-request-url }}"

      - name: Set Version to Todays Date
        id: extract_version
        run: |
          $version = (Get-Date -Format "yy.MM.dd")
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "version=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create Tag
        id: create_tag
        run: |
          $tagExists = git tag -l $env:VERSION
          if ($tagExists -eq "") {
            git tag $env:VERSION
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to create tag $env:VERSION"
              exit 1
            }
            git push origin $env:VERSION
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to push tag $env:VERSION"
              exit 1
            }
          } else {
            Write-Host "Tag $env:VERSION already exists, skipping tag creation"
          }
        shell: pwsh

      - name: Upload compiled script
        uses: actions/upload-artifact@v7
        with:
          name: winutil-ps1
          path: ./winutil.ps1

  installed-acceptance:
    needs: build-runspace
    runs-on: [self-hosted, Windows, X64, win11creator-validation]
    env:
      WINUTIL_STOCK_CONTROL_ISO_PATH: ${{ vars.WINUTIL_STOCK_CONTROL_ISO_PATH }}
      WINUTIL_LEAN_DAW_ISO_PATH: ${{ vars.WINUTIL_LEAN_DAW_ISO_PATH }}
      WINUTIL_UNATTEND_ISO_PATH: ${{ vars.WINUTIL_UNATTEND_ISO_PATH }}
      WINUTIL_HYPERV_SWITCH: ${{ vars.WINUTIL_HYPERV_SWITCH }}
      WINUTIL_VM_GUEST_USERNAME: ${{ vars.WINUTIL_VM_GUEST_USERNAME }}
      WINUTIL_VM_GUEST_PASSWORD: ${{ secrets.WINUTIL_VM_GUEST_PASSWORD }}
      WINUTIL_POST_LOGIN_SMOKE_COMMAND: ${{ vars.WINUTIL_POST_LOGIN_SMOKE_COMMAND }}
      WINUTIL_ABLETON_PATH: ${{ vars.WINUTIL_ABLETON_PATH }}
      WINUTIL_VST3_PATHS: ${{ vars.WINUTIL_VST3_PATHS }}
      WINUTIL_LATENCYMON_REPORT: ${{ vars.WINUTIL_LATENCYMON_REPORT }}
      WINUTIL_DAW_SMOKE_COMMAND: ${{ vars.WINUTIL_DAW_SMOKE_COMMAND }}
    steps:
      - name: Checkout acceptance harness
        uses: actions/checkout@v7

      - name: Install generated ISOs and run guest acceptance gates
        shell: pwsh
        run: |
          foreach ($requiredValue in @{
            WINUTIL_STOCK_CONTROL_ISO_PATH = $env:WINUTIL_STOCK_CONTROL_ISO_PATH
            WINUTIL_LEAN_DAW_ISO_PATH = $env:WINUTIL_LEAN_DAW_ISO_PATH
            WINUTIL_UNATTEND_ISO_PATH = $env:WINUTIL_UNATTEND_ISO_PATH
            WINUTIL_HYPERV_SWITCH = $env:WINUTIL_HYPERV_SWITCH
            WINUTIL_VM_GUEST_USERNAME = $env:WINUTIL_VM_GUEST_USERNAME
            WINUTIL_VM_GUEST_PASSWORD = $env:WINUTIL_VM_GUEST_PASSWORD
            WINUTIL_POST_LOGIN_SMOKE_COMMAND = $env:WINUTIL_POST_LOGIN_SMOKE_COMMAND
          }.GetEnumerator()) {
            if (-not $requiredValue.Value) { throw "Required validation setting '$($requiredValue.Key)' is empty." }
          }
          $credential = [pscredential]::new(
            $env:WINUTIL_VM_GUEST_USERNAME,
            (ConvertTo-SecureString $env:WINUTIL_VM_GUEST_PASSWORD -AsPlainText -Force)
          )
          $vst3Paths = @($env:WINUTIL_VST3_PATHS -split ';' | Where-Object { $_ })

          ./tools/Invoke-WinUtilHyperVAcceptance.ps1 `
            -IsoPath $env:WINUTIL_STOCK_CONTROL_ISO_PATH `
            -UnattendIsoPath $env:WINUTIL_UNATTEND_ISO_PATH `
            -ExpectedState StockControl `
            -Depth Quick `
            -VMName 'WinUtil-Stock-${{ github.run_id }}-${{ github.run_attempt }}' `
            -SwitchName $env:WINUTIL_HYPERV_SWITCH `
            -VhdPath '${{ runner.temp }}\winutil-stock-${{ github.run_id }}-${{ github.run_attempt }}.vhdx' `
            -OutputDirectory '${{ runner.temp }}\winutil-stock-acceptance-${{ github.run_id }}-${{ github.run_attempt }}' `
            -GuestCredential $credential `
            -PostLoginSmokeCommand $env:WINUTIL_POST_LOGIN_SMOKE_COMMAND

          ./tools/Invoke-WinUtilHyperVAcceptance.ps1 `
            -IsoPath $env:WINUTIL_LEAN_DAW_ISO_PATH `
            -UnattendIsoPath $env:WINUTIL_UNATTEND_ISO_PATH `
            -ExpectedState LeanDaw `
            -Depth '${{ inputs['validation-depth'] }}' `
            -VMName 'WinUtil-Lean-${{ github.run_id }}-${{ github.run_attempt }}' `
            -SwitchName $env:WINUTIL_HYPERV_SWITCH `
            -VhdPath '${{ runner.temp }}\winutil-lean-${{ github.run_id }}-${{ github.run_attempt }}.vhdx' `
            -OutputDirectory '${{ runner.temp }}\winutil-lean-acceptance-${{ github.run_id }}-${{ github.run_attempt }}' `
            -GuestCredential $credential `
            -AbletonPath $env:WINUTIL_ABLETON_PATH `
            -Vst3Path $vst3Paths `
            -LatencyMonReportPath $env:WINUTIL_LATENCYMON_REPORT `
            -SmokeCommand $env:WINUTIL_DAW_SMOKE_COMMAND `
            -PostLoginSmokeCommand $env:WINUTIL_POST_LOGIN_SMOKE_COMMAND

      - name: Upload installed acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: winutil-installed-acceptance
          path: |
            ${{ runner.temp }}\winutil-stock-acceptance-${{ github.run_id }}-${{ github.run_attempt }}\**
            ${{ runner.temp }}\winutil-lean-acceptance-${{ github.run_id }}-${{ github.run_attempt }}\**
          if-no-files-found: error

  release:
    needs: [build-runspace, installed-acceptance]
    runs-on: ubuntu-latest
    steps:
      - name: Download compiled script
        uses: actions/download-artifact@v8
        with:
          name: winutil-ps1

      - name: Set version from build job
        run: echo "VERSION=${{ needs.build-runspace.outputs.version }}" >> $GITHUB_ENV

      - name: Generate Release Notes
        id: generate_notes
        uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-name: release-drafter.yml
          version: ${{ env.VERSION }}

      - name: Remove Automated Updates from Release Notes
        id: filter_notes
        shell: pwsh
        env:
          RELEASE_NOTES: ${{ steps.generate_notes.outputs.body }}
        run: |
          $filteredNotes = ($env:RELEASE_NOTES -split '\r?\n' | Where-Object {
            $_ -notmatch '(?i)Update (Generated Dev Docs|Sponsors)'
          }) -join "`n"

          $delimiter = [guid]::NewGuid().ToString()
          "body<<$delimiter" >> $env:GITHUB_OUTPUT
          $filteredNotes >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT

      - name: Create and Upload Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: Pre-Release ${{ env.VERSION }}
          body: |
            ${{ steps.filter_notes.outputs.body }}

            ![GitHub Downloads (specific asset, specific tag)](https://img.shields.io/github/downloads/ChrisTitusTech/winutil/${{ env.VERSION }}/winutil.ps1)
          append_body: false
          files: ./winutil.ps1
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
